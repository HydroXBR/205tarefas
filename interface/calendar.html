<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Calendário - MedTasks</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="calendar.css">
    <link rel="icon" type="image/png" href="https://i.ibb.co/nqmZ9nGr/Logo-IG-Med-Ufam116-3x.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="https://i.ibb.co/5XVmGm7h/marca-ufam-vetor-positivo.png" alt="UFAM Logo" class="ufam-logo">
                <div class="turma-logo-container">
                    <img src="https://i.ibb.co/nqmZ9nGr/Logo-IG-Med-Ufam116-3x.png" alt="Turma 116" class="turma-logo">
                </div>
                <div class="logo-text">
                    <span class="med-text">Med</span><span class="tasks-text">Tasks</span>
                </div>
            </div>
            <div class="menu-icon" id="menuIcon" role="button" tabindex="0" aria-label="Abrir menu" aria-expanded="false" aria-controls="navLinks">
                <i class="fas fa-bars"></i>
            </div>
            <div class="nav-links" id="navLinks">
                <a href="/"><i class="fas fa-house"></i> Início</a>
                <a href="/calendar" class="active" aria-current="page"><i class="fas fa-calendar-week"></i> Calendário</a>
                <a href="/ppc"><i class="fas fa-book-open"></i> PPC</a>
                <a href="/sobre"><i class="fas fa-circle-info"></i> Sobre</a>
                <a href="/add" class="btn-add"><i class="fas fa-plus"></i> Adicionar tarefa</a>
                <a href="/addlembrete" class="btn-add" style="background: #3b82f6;"><i class="fas fa-bell"></i> Adicionar lembrete</a>
            </div>
        </div>
    </nav>

    <div class="calendar-container">
        <div class="page-intro">
            <h1><i class="fas fa-calendar-week"></i> Calendário</h1>
            <p>Todas as entregas da turma, mês a mês</p>
        </div>

        <div class="calendar-header">
            <div class="calendar-nav">
                <button id="prevMonth" aria-label="Mês anterior"><i class="fas fa-chevron-left"></i></button>
                <span class="current-month" id="currentMonth" aria-live="polite">Janeiro 2024</span>
                <button id="nextMonth" aria-label="Próximo mês"><i class="fas fa-chevron-right"></i></button>
                <button id="todayBtn">Hoje</button>
            </div>
            <div class="turma-filter" role="group" aria-label="Filtrar por turma">
                <button class="filter-btn active" data-turma="all" aria-pressed="true">Todas</button>
                <button class="filter-btn" data-turma="t1-t3" aria-pressed="false">T1-T3</button>
                <button class="filter-btn" data-turma="t4-t6" aria-pressed="false">T4-T6</button>
            </div>
        </div>

        <div class="calendar-grid">
            <div class="weekdays">
                <div class="weekday">Dom</div>
                <div class="weekday">Seg</div>
                <div class="weekday">Ter</div>
                <div class="weekday">Qua</div>
                <div class="weekday">Qui</div>
                <div class="weekday">Sex</div>
                <div class="weekday">Sáb</div>
            </div>
            <div class="calendar-days" id="calendarDays">
                <div class="loading-calendar">
                    <div class="loader"></div>
                    <p>Carregando calendário…</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de detalhes -->
    <div class="modal" id="taskModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle"><i class="fas fa-list-check"></i> Tarefas do dia</h3>
                <button class="modal-close" id="closeModal" aria-label="Fechar">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Tarefas serão inseridas aqui -->
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 MedTasks — MED UFAM 116, Faculdade de Medicina UFAM</p>
        </div>
    </footer>

    <script>
        let currentDate = new Date();
        let allTasks = [];
        let currentTurma = 'all';
        let lastFocusedElement = null;

        const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

        const disciplinas = [
            { value: "isc", label: "Introdução à Saúde Coletiva" },
            { value: "bcm", label: "Biologia Celular e Molecular" },
            { value: "ah1", label: "Anatomia Humana I" },
            { value: "emb", label: "Embriologia" },
            { value: "metodologia", label: "Metodologia do Trabalho Científico" },
            { value: "etica", label: "Ética Médica" }
        ];

        // Função para formatar data em YYYY-MM-DD (UTC)
        function formatDateUTC(timestamp) {
            const date = new Date(timestamp);
            const year = date.getUTCFullYear();
            const month = String(date.getUTCMonth() + 1).padStart(2, '0');
            const day = String(date.getUTCDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Função para obter a data atual em UTC
        function getTodayUTC() {
            const now = new Date();
            return new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
        }

        // Função para verificar se uma tarefa pertence à turma selecionada
        function taskBelongsToTurma(task, turma) {
            if (turma === 'all') return true;
            if (task.turmasInfo && task.turmasInfo.length > 0) {
                return task.turmasInfo.some(info => info.turma === turma);
            }
            return task.turma === turma;
        }

        // Função para obter tarefas de uma data específica (sem duplicar)
        function getTasksForDate(dateStr) {
            const tasksForDate = [];
            const tasksMap = new Map();

            allTasks.forEach(task => {
                if (task.turmasInfo && task.turmasInfo.length > 0) {
                    task.turmasInfo.forEach(info => {
                        const entregaStr = formatDateUTC(info.entrega);
                        if (entregaStr === dateStr && taskBelongsToTurma(task, currentTurma)) {
                            const key = task._id;
                            if (!tasksMap.has(key)) {
                                tasksMap.set(key, {
                                    id: task._id,
                                    title: task.title,
                                    tipo: task.tipo,
                                    turmas: [info.turma],
                                    disciplina: task.disc,
                                    observacoes: info.observacao ? [info.observacao] : []
                                });
                            } else {
                                const existing = tasksMap.get(key);
                                if (!existing.turmas.includes(info.turma)) {
                                    existing.turmas.push(info.turma);
                                }
                                if (info.observacao && !existing.observacoes.includes(info.observacao)) {
                                    existing.observacoes.push(info.observacao);
                                }
                            }
                        }
                    });
                } else if (task.entrega) {
                    const entregaStr = formatDateUTC(task.entrega);
                    if (entregaStr === dateStr && taskBelongsToTurma(task, currentTurma)) {
                        const key = task._id;
                        if (!tasksMap.has(key)) {
                            tasksMap.set(key, {
                                id: task._id,
                                title: task.title,
                                tipo: task.tipo,
                                turmas: [task.turma || 'geral'],
                                disciplina: task.disc,
                                observacoes: []
                            });
                        }
                    }
                }
            });

            tasksMap.forEach((value) => tasksForDate.push(value));
            return tasksForDate;
        }

        function getTipoClass(tipo) {
            const classes = {
                'prova': 'prova',
                'trabalho': 'trabalho',
                'seminário': 'seminário',
                'atividade': 'atividade',
                'leitura': 'leitura',
                'prática': 'prática'
            };
            return classes[tipo?.toLowerCase()] || 'atividade';
        }

        function getLabelByValue(value) {
            const disc = disciplinas.find(d => d.value === value);
            return disc ? disc.label : value;
        }

        async function loadCalendar() {
            try {
                const response = await fetch('/tasks');
                allTasks = await response.json();
                renderCalendar();
            } catch (error) {
                console.error('Erro ao carregar tarefas:', error);
                document.getElementById('calendarDays').innerHTML =
                    '<div class="loading-calendar"><i class="fas fa-triangle-exclamation"></i><p>Erro ao carregar calendário</p></div>';
            }
        }

        function renderCalendar() {
            const year = currentDate.getUTCFullYear();
            const month = currentDate.getUTCMonth();

            document.getElementById('currentMonth').textContent = `${meses[month]} ${year}`;

            const firstDayOfMonth = new Date(Date.UTC(year, month, 1));
            const startDay = firstDayOfMonth.getUTCDay();

            const daysInMonth = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
            const daysInPrevMonth = new Date(Date.UTC(year, month, 0)).getUTCDate();

            const calendarDays = document.getElementById('calendarDays');
            calendarDays.innerHTML = '';

            const todayUTC = getTodayUTC();
            const todayStr = formatDateUTC(todayUTC.getTime());

            for (let i = startDay - 1; i >= 0; i--) {
                const day = daysInPrevMonth - i;
                const date = new Date(Date.UTC(year, month - 1, day));
                const dateStr = formatDateUTC(date.getTime());
                const tasks = getTasksForDate(dateStr);
                calendarDays.appendChild(createDayCell(day, true, dateStr, tasks, false));
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(Date.UTC(year, month, day));
                const dateStr = formatDateUTC(date.getTime());
                const tasks = getTasksForDate(dateStr);
                const isToday = dateStr === todayStr;
                calendarDays.appendChild(createDayCell(day, false, dateStr, tasks, isToday));
            }

            const totalCells = Math.ceil((startDay + daysInMonth) / 7) * 7;
            const nextMonthDays = totalCells - (startDay + daysInMonth);
            for (let day = 1; day <= nextMonthDays; day++) {
                const date = new Date(Date.UTC(year, month + 1, day));
                const dateStr = formatDateUTC(date.getTime());
                const tasks = getTasksForDate(dateStr);
                calendarDays.appendChild(createDayCell(day, true, dateStr, tasks, false));
            }
        }

        function createDayCell(day, isOtherMonth, dateStr, tasks, isToday) {
            const cell = document.createElement('div');
            cell.className = 'calendar-day';
            if (isOtherMonth) cell.classList.add('other-month');
            if (isToday) cell.classList.add('today');

            const dayNumber = document.createElement('div');
            dayNumber.className = 'day-number';
            dayNumber.textContent = day;
            cell.appendChild(dayNumber);

            if (tasks.length > 0) {
                cell.classList.add('has-tasks');
                cell.dataset.taskCount = tasks.length;
                cell.setAttribute('role', 'button');
                cell.setAttribute('tabindex', '0');
                cell.setAttribute('aria-label', `${day}, ${tasks.length} tarefa${tasks.length > 1 ? 's' : ''}. Abrir detalhes.`);

                const taskList = document.createElement('div');
                taskList.className = 'task-list';

                const maxDisplay = 3;
                const displayedTasks = tasks.slice(0, maxDisplay);

                displayedTasks.forEach(task => {
                    const turmasLabel = task.turmas.length > 1 ? ' [Ambas]' : (task.turmas[0] === 't1-t3' ? ' [T1-T3]' : (task.turmas[0] === 't4-t6' ? ' [T4-T6]' : ''));
                    const displayTitle = task.title.length > 15 ? task.title.substring(0, 13) + '...' : task.title;

                    const taskBadge = document.createElement('div');
                    taskBadge.className = `task-badge ${getTipoClass(task.tipo)}`;
                    taskBadge.textContent = displayTitle;
                    taskBadge.title = `${task.title} (${task.turmas.map(t => t === 't1-t3' ? 'T1-T3' : 'T4-T6').join(' e ')})`;
                    taskBadge.setAttribute('role', 'button');
                    taskBadge.setAttribute('tabindex', '-1');
                    taskBadge.onclick = (e) => {
                        e.stopPropagation();
                        window.location.href = `/tarefa?id=${task.id}`;
                    };
                    taskList.appendChild(taskBadge);
                });

                if (tasks.length > maxDisplay) {
                    const moreBtn = document.createElement('div');
                    moreBtn.className = 'more-tasks';
                    moreBtn.textContent = `+ ${tasks.length - maxDisplay} mais`;
                    moreBtn.setAttribute('tabindex', '-1');
                    moreBtn.onclick = (e) => {
                        e.stopPropagation();
                        showModal(dateStr, tasks, cell);
                    };
                    taskList.appendChild(moreBtn);
                }

                cell.appendChild(taskList);

                cell.addEventListener('click', () => showModal(dateStr, tasks, cell));
                cell.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        showModal(dateStr, tasks, cell);
                    }
                });
            }

            return cell;
        }

        function showModal(dateStr, tasks, triggerEl) {
            lastFocusedElement = triggerEl || document.activeElement;

            const modal = document.getElementById('taskModal');
            const modalBody = document.getElementById('modalBody');

            const [year, month, day] = dateStr.split('-');
            const dateFormatted = `${day}/${month}/${year}`;

            modalBody.innerHTML = `
                <p class="modal-date"><strong>${dateFormatted}</strong> — ${tasks.length} tarefa${tasks.length > 1 ? 's' : ''}</p>
                ${tasks.map(task => {
                    const turmasLabel = task.turmas.map(t => t === 't1-t3' ? 'T1-T3' : (t === 't4-t6' ? 'T4-T6' : 'Geral')).join(' e ');
                    const observacao = task.observacoes.length > 0 ? task.observacoes.join(' | ') : '';

                    return `
                        <div class="modal-task-item" role="button" tabindex="0" onclick="window.location.href='/tarefa?id=${task.id}'" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();window.location.href='/tarefa?id=${task.id}'}">
                            <div class="modal-task-title">${task.title}</div>
                            <div class="modal-task-disc">${getLabelByValue(task.disciplina)}</div>
                            <div class="modal-task-meta">
                                <span class="modal-task-type ${getTipoClass(task.tipo)}">${task.tipo}</span>
                                <span class="modal-task-turmas">${turmasLabel}</span>
                            </div>
                            ${observacao ? `<div class="modal-task-obs"><i class="fas fa-circle-info"></i> ${observacao}</div>` : ''}
                        </div>
                    `;
                }).join('')}
            `;

            modal.classList.add('active');
            document.getElementById('closeModal').focus();
        }

        function closeModal() {
            document.getElementById('taskModal').classList.remove('active');
            if (lastFocusedElement) lastFocusedElement.focus();
        }

        // Navegação do calendário
        document.getElementById('prevMonth').addEventListener('click', () => {
            currentDate.setUTCMonth(currentDate.getUTCMonth() - 1);
            renderCalendar();
        });

        document.getElementById('nextMonth').addEventListener('click', () => {
            currentDate.setUTCMonth(currentDate.getUTCMonth() + 1);
            renderCalendar();
        });

        document.getElementById('todayBtn').addEventListener('click', () => {
            currentDate = new Date();
            renderCalendar();
        });

        // Filtro por turma
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('active');
                    b.setAttribute('aria-pressed', 'false');
                });
                btn.classList.add('active');
                btn.setAttribute('aria-pressed', 'true');
                currentTurma = btn.dataset.turma;
                renderCalendar();
            });
        });

        // Modal
        document.getElementById('closeModal').addEventListener('click', closeModal);

        document.getElementById('taskModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('taskModal')) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('taskModal').classList.contains('active')) {
                closeModal();
            }
        });

        // Menu mobile
        const menuIcon = document.getElementById('menuIcon');
        const navLinks = document.getElementById('navLinks');
        function toggleMenu() {
            const isOpen = navLinks.classList.toggle('active');
            menuIcon.setAttribute('aria-expanded', isOpen);
        }
        menuIcon.addEventListener('click', toggleMenu);
        menuIcon.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                toggleMenu();
            }
        });

        // Inicializar
        loadCalendar();
    </script>
</body>
</html>
