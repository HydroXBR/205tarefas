    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <link rel="stylesheet" href="index.css">
    <link rel="icon" type="image/png" href="https://i.ibb.co/nqmZ9nGr/Logo-IG-Med-Ufam116-3x.png">

<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="https://i.ibb.co/5XVmGm7h/marca-ufam-vetor-positivo.png" alt="UFAM Logo" class="ufam-logo">
                <div class="turma-logo-container">
                    <img src="https://i.ibb.co/nqmZ9nGr/Logo-IG-Med-Ufam116-3x.png" alt="Turma 116" class="turma-logo">
                </div>
                <div class="logo-text">
                    <span class="med-text">Med</span><span class="tasks-text">Tasks</span>
                    <span class="turma-badge">Turma 116</span>
                </div>
            </div>
            <div class="menu-icon" id="menuIcon">
                <i class="fas fa-bars"></i>
            </div>
            <div class="nav-links" id="navLinks">
                <a href="/"><i class="fas fa-home"></i> Início</a>
                <a href="/horarios"><i class="fas fa-calendar-alt"></i> Horários</a>
                <a href="/calendar"><i class="fas fa-calendar-week"></i> Calendário</a>
                <a href="/ppc"><i class="fas fa-book-open"></i> PPC</a>
                <a href="/sobre"><i class="fas fa-info-circle"></i> Sobre</a>
                <a href="/add" class="btn-add"><i class="fas fa-plus"></i> Adicionar Tarefa</a>
                <a href="/addlembrete" class="btn-add" style="background: #3b82f6;"><i class="fas fa-bell"></i>Adicionar Lembrete</a>
            </div>
        </div>
    </nav>

    <div class="task-detail-container" id="taskContainer">
        <div class="loading">
            <div class="loader"></div>
            <p>Carregando detalhes da tarefa...</p>
        </div>
    </div>

    <button class="btn-voltar" id="btnVoltar">
        <i class="fas fa-arrow-up"></i>
    </button>

    <footer class="footer">
        <div class="footer-content">
            <p><i class="far fa-copyright"></i> 2026 MedTasks - Turma 116 - Faculdade de Medicina UFAM</p>
        </div>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tarefaId = urlParams.get('id');
        const isAdmin = true;

        // Lista de alunos da turma
        const alunos = [

            { "complete": "João Guilherme", "id": "guilhermef" },
            { "complete": "Laisa Vásquez", "id": "laisavasquez" },
            { "complete": "Luana Dias", "id": "luanadias" },

            { "complete": "Sérgio Mazzini", "id": "sergiomazzini" },
            { "complete": "Sofia Pachalian", "id": "sofiapachalian" },
            { "complete": "Sol", "id": "sol" },
            { "complete": "Sophia Melo", "id": "sophiamelo" },
            { "complete": "Thiago Luniere", "id": "thiagoluniere" },
            { "complete": "Vitor Leocádio", "id": "vitorleocadio" },
            { "complete": "Vitório Gabriel", "id": "vitorio" },
            { "complete": "Yanno Pereira", "id": "yanno" }
        ];

        // Lista de disciplinas
        const disciplinas = [
            { value: "histo", label: "Histologia" },
            { value: "bioq", label: "Bioquímica Celular e Metabólica" },
            { value: "ah2", label: "Anatomia Humana II" },
            { value: "genetica", label: "Genética" },
            { value: "ppgs", label: "Política, Planejamento e Gestão em Saúde" },
            { value: "micro", label: "Microbiologia Médica" },
            { value: "para", label: "Parasitologia Médica" },
            { value: "mico", label: "Micologia Médica" },
            { value: "epidemio", label: "Epidemiologia e Bioestatística" },
            { value: "imuno", label: "Imunologia Médica" },
            { value: "fisio", label: "Fisiologia Humana" }
        ];

        function getAlunoName(id) {
            const aluno = alunos.find(a => a.id === id);
            return aluno ? aluno.complete : id;
        }

        function getDisciplinaLabel(value) {
            const disc = disciplinas.find(d => d.value === value);
            return disc ? disc.label : value;
        }

        function formatarData(timestamp) {
            const data = new Date(timestamp);
            const dia = data.getUTCDate().toString().padStart(2, '0');
            const mes = (data.getUTCMonth() + 1).toString().padStart(2, '0');
            const ano = data.getUTCFullYear();
            return `${dia}/${mes}/${ano}`;
        }

        function formatarDataCompleta(timestamp) {
            const data = new Date(timestamp);
            const dia = data.getUTCDate().toString().padStart(2, '0');
            const mes = (data.getUTCMonth() + 1).toString().padStart(2, '0');
            const ano = data.getUTCFullYear();
            const horas = data.getUTCHours().toString().padStart(2, '0');
            const minutos = data.getUTCMinutes().toString().padStart(2, '0');
            return `${dia}/${mes}/${ano} às ${horas}:${minutos}`;
        }

        function getTipoClass(tipo) {
            const classes = {
                'prova': 'tipo-prova',
                'trabalho': 'tipo-trabalho',
                'seminário': 'tipo-seminario',
                'atividade': 'tipo-atividade',
                'prática': 'tipo-pratica'
            };
            return classes[tipo?.toLowerCase()] || 'tipo-atividade';
        }

        async function addDays(id, days) {
            try {
                const response = await fetch(`/moredays?id=${id}&days=${days}`);
                const result = await response.json();
                
                if (result.success) {
                    alert(`✅ ${days} dia(s) adicionado(s) a todas as turmas com sucesso!`);
                    carregarTarefa(id); // Recarregar a página para mostrar as novas datas
                } else {
                    alert('Erro ao adicionar os dias: ' + (result.reason || 'Tente novamente.'));
                }
            } catch (err) {
                console.error('Erro:', err);
                alert('Erro ao conectar com o servidor.');
            }
        }

        async function deleteTask(id) {
            if (confirm('Tem certeza que deseja deletar esta tarefa? Esta ação não pode ser desfeita.')) {
                try {
                    const response = await fetch(`/apagar?id=${id}&token=22222`);
                    const result = await response.json();
                    if (result.success === false) {
                        alert('Erro ao deletar tarefa!');
                    } else {
                        alert('Tarefa deletada com sucesso!');
                        window.location.href = isAdmin ? '/?admin=true' : '/';
                    }
                } catch (err) {
                    console.error('Erro:', err);
                    alert('Erro ao conectar com o servidor.');
                }
            }
        }

        async function addComment(id, author, comment) {
            try {
                const date = new Date().toISOString();
                const response = await fetch(`/comment?author=${author}&comment=${encodeURIComponent(comment)}&date=${date}&idtar=${id}`);
                const result = await response.json();
                if (result.success) {
                    carregarTarefa(id);
                    document.getElementById('novo-comentario').value = '';
                } else {
                    alert('Erro ao adicionar comentário.');
                }
            } catch (err) {
                console.error('Erro:', err);
                alert('Erro ao conectar com o servidor.');
            }
        }

        async function carregarTarefa(id) {
            try {
                const response = await fetch(`/search?id=${id}`);
                const tarefa = await response.json();
                
                if (!tarefa || tarefa === null) {
                    document.getElementById('taskContainer').innerHTML = `
                        <div class="task-card">
                            <div class="task-header">
                                <h1>Tarefa não encontrada</h1>
                            </div>
                            <div class="task-body">
                                <p>A tarefa solicitada não existe ou foi removida.</p>
                                <a href="/" class="btn-submit" style="display: inline-block; text-decoration: none; margin-top: 1rem;">Voltar ao início</a>
                            </div>
                        </div>
                    `;
                    return;
                }
                
                const tipoLabel = tarefa.tipo ? tarefa.tipo.charAt(0).toUpperCase() + tarefa.tipo.slice(1) : 'Não definido';
                
                let turmasHtml = '';
                if (tarefa.turmasInfo && tarefa.turmasInfo.length > 0) {
                    tarefa.turmasInfo.forEach(info => {
                        const turmaLabel = info.turma === 't1-t3' ? 'Turmas T1 - T3' : 'Turmas T4 - T6';
                        const turmaClass = info.turma === 't1-t3' ? 'turma-t1' : 'turma-t4';
                        turmasHtml += `
                            <div class="turma-detail-card">
                                <div class="turma-detail-info">
                                    <div class="turma-name" style="color: ${info.turma === 't1-t3' ? 'var(--primary-green)' : '#3b82f6'}">
                                        <i class="fas ${info.turma === 't1-t3' ? 'fa-users' : 'fa-user-md'}"></i> ${turmaLabel}
                                    </div>
                                    ${info.observacao ? `<div class="turma-obs"><i class="fas fa-info-circle"></i> <span style="white-space: pre-wrap;">${info.observacao.replace(/\n/g, '<br>')}</span></div>` : ''}
                                </div>
                                <div class="turma-date">
                                    <div class="date">${formatarData(info.entrega)}</div>
                                    <div class="status">Data de entrega</div>
                                </div>
                            </div>
                        `;
                    });
                } else if (tarefa.turma && tarefa.entrega) {
                    // Compatibilidade com formato antigo
                    const turmaLabel = tarefa.turma === 't1-t3' ? 'Turmas T1 - T3' : 'Turmas T4 - T6';
                    turmasHtml = `
                        <div class="turma-detail-card">
                            <div class="turma-detail-info">
                                <div class="turma-name">${turmaLabel}</div>
                            </div>
                            <div class="turma-date">
                                <div class="date">${formatarData(tarefa.entrega)}</div>
                                <div class="status">Data de entrega</div>
                            </div>
                        </div>
                    `;
                }
                
                const adminHtml = isAdmin ? `
                    <div class="admin-actions">
                        <div class="add-days-group">
                            <input type="number" id="diasAdicionar" placeholder="Dias a adicionar" style="width: 120px;">
                            <button class="btn-admin" id="btnAddDays">
                                <i class="fas fa-plus-circle"></i> Adicionar Dias
                            </button>
                        </div>
                        <button class="btn-admin btn-danger" id="btnDelete">
                            <i class="fas fa-trash-alt"></i> Deletar Tarefa
                        </button>
                    </div>
                ` : '';
                
                const observacaoGeralHtml = tarefa.observacaoGeral ? `
                    <div class="observacao-geral">
                        <i class="fas fa-info-circle"></i> <strong>Observação Geral:</strong> 
                        <span style="white-space: pre-wrap;">${tarefa.observacaoGeral.replace(/\n/g, '<br>')}</span>
                    </div>
                ` : '';
                
                const comentariosHtml = tarefa.comments && tarefa.comments.length > 0 ? 
                    tarefa.comments.map(comment => `
                        <div class="comentario-item">
                            <div class="comentario-header">
                                <span class="comentario-author">${getAlunoName(comment.author)}</span>
                                <span class="comentario-date">${formatarDataCompleta(comment.date)}</span>
                            </div>
                            <div class="comentario-text">${comment.comment}</div>
                        </div>
                    `).join('') : 
                    '<p style="text-align: center; color: var(--text-secondary);">Nenhum comentário ainda. Seja o primeiro a comentar!</p>';
                
              const html = `
                <div class="task-card">
                    <div class="task-header">
                        <h1><i class="fas fa-tasks"></i> ${tarefa.title}</h1>
                        <span class="task-type-badge ${getTipoClass(tarefa.tipo)}">${tipoLabel}</span>
                    </div>
                    <div class="task-body">
                        ${adminHtml}
                        
                        ${observacaoGeralHtml}
                        
                        <div class="descricao-box">
                            <h3><i class="fas fa-align-left"></i> Descrição</h3>
                            <p>${tarefa.desc.replace(/\n/g, '<br>').replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>')}</p>
                        </div>
                        
                        <div class="info-grid">
                            <div class="info-card">
                                <h3><i class="fas fa-user-md"></i> Autor</h3>
                                <p>${getAlunoName(tarefa.author)}</p>
                            </div>
                            <div class="info-card">
                                <h3><i class="fas fa-book"></i> Disciplina</h3>
                                <p>${getDisciplinaLabel(tarefa.disc)}</p>
                            </div>
                            <div class="info-card">
                                <h3><i class="fas fa-chart-line"></i> Nível</h3>
                                <p>${tarefa.nivel}</p>
                            </div>
                            <div class="info-card">
                                <h3><i class="fas fa-calendar-day"></i> Data Solicitada</h3>
                                <p>${formatarData(tarefa.pedida)}</p>
                            </div>
                            <div class="info-card">
                                <h3><i class="fas fa-clock"></i> Registrado em</h3>
                                <p>${formatarDataCompleta(tarefa.registered)}</p>
                            </div>
                        </div>
                        
                        ${turmasHtml ? `
                            <div class="turmas-section">
                                <h3><i class="fas fa-users"></i> Turmas e Datas de Entrega</h3>
                                ${turmasHtml}
                            </div>
                        ` : ''}
                        
                        <!-- COMENTÁRIOS DENTRO DO TASK-BODY -->
                        <div class="comentarios-section">
                            <div class="comentarios-header">
                                <h3><i class="fas fa-comments"></i> Comentários (${tarefa.comments?.length || 0})</h3>
                            </div>
                            <div class="comentarios-list" id="comentariosList">
                                ${comentariosHtml}
                            </div>
                            <div class="novo-comentario">
                                <select id="selecionar-nome" class="form-select">
                                    <option value="">Selecione seu nome</option>
                                    ${alunos.map(aluno => `<option value="${aluno.id}">${aluno.complete}</option>`).join('')}
                                </select>
                                <textarea id="novo-comentario" class="textarea-comentario" rows="3" placeholder="Digite seu comentário aqui..."></textarea>
                                <button id="enviar-comentario" class="btn-enviar">
                                    <i class="fas fa-paper-plane"></i> Enviar Comentário
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
                
                document.getElementById('taskContainer').innerHTML = html;
                
                if (isAdmin) {
                    document.getElementById('btnAddDays')?.addEventListener('click', () => {
                        const dias = document.getElementById('diasAdicionar').value;
                        if (dias && !isNaN(dias)) {
                            addDays(id, dias);
                        } else {
                            alert('Digite um número válido de dias.');
                        }
                    });
                    document.getElementById('btnDelete')?.addEventListener('click', () => deleteTask(id));
                }
                
                document.getElementById('enviar-comentario')?.addEventListener('click', () => {
                    const author = document.getElementById('selecionar-nome').value;
                    const comment = document.getElementById('novo-comentario').value.trim();
                    if (!author) {
                        alert('Por favor, selecione seu nome.');
                        return;
                    }
                    if (!comment) {
                        alert('Por favor, digite um comentário.');
                        return;
                    }
                    addComment(id, author, comment);
                });
                
            } catch (err) {
                console.error('Erro ao carregar tarefa:', err);
                document.getElementById('taskContainer').innerHTML = `
                    <div class="task-card">
                        <div class="task-header">
                            <h1>Erro ao carregar tarefa</h1>
                        </div>
                        <div class="task-body">
                            <p>Ocorreu um erro ao carregar os detalhes da tarefa. Tente novamente mais tarde.</p>
                            <a href="/" class="btn-submit" style="display: inline-block; text-decoration: none; margin-top: 1rem;">Voltar ao início</a>
                        </div>
                    </div>
                `;
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            if (tarefaId) {
                carregarTarefa(tarefaId);
            } else {
                document.getElementById('taskContainer').innerHTML = `
                    <div class="task-card">
                        <div class="task-header">
                            <h1>Tarefa não especificada</h1>
                        </div>
                        <div class="task-body">
                            <p>Nenhum ID de tarefa foi fornecido.</p>
                            <a href="/" class="btn-submit" style="display: inline-block; text-decoration: none; margin-top: 1rem;">Voltar ao início</a>
                        </div>
                    </div>
                `;
            }
            
            document.getElementById('btnVoltar').addEventListener('click', () => {
                window.location.href = isAdmin ? '/?admin=true' : '/';
            });
            
            document.getElementById('menuIcon').addEventListener('click', () => {
                document.getElementById('navLinks').classList.toggle('active');
            });
        });
    </script>
</body>
</html>
