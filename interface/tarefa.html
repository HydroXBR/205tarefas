<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Detalhes da Tarefa - MedTasks</title>
    <link rel="stylesheet" href="index.css">
    <link rel="icon" type="image/png" href="https://i.ibb.co/nqmZ9nGr/Logo-IG-Med-Ufam116-3x.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #121210;
            --bg-card: #1a1a15;
            --bg-elevated: #212119;
            --border-color: #2e2e24;
            --primary-green: #6b7a2a;
            --primary-green-dark: #4c581e;
            --primary-green-light: #97ac3e;
            --accent-blue: #3b82f6;
            --danger: #ef4444;
            --warning: #f59e0b;
            --purple: #8b5cf6;
            --text-primary: #f1efe4;
            --text-secondary: #9c9a8a;
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.35);
        }
 
        * { box-sizing: border-box; }
 
        html { scroll-behavior: smooth; }
 
        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(1200px 500px at 15% -10%, rgba(107, 122, 42, 0.12), transparent 60%),
                var(--bg-dark);
            color: var(--text-primary);
            font-family: 'IBM Plex Sans', -apple-system, sans-serif;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }
 
        h1, h2, h3, h4 { font-family: 'Fraunces', serif; font-weight: 600; margin: 0; }
 
        a { color: inherit; }
 
        ::selection { background: rgba(107, 122, 42, 0.4); }
 
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-green); }
 
        :focus-visible {
            outline: 2px solid var(--primary-green-light);
            outline-offset: 2px;
        }
 
        /* ===== Navbar ===== */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(26, 26, 21, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
        }
 
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0.85rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
        }
 
        .nav-logo { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }
        .ufam-logo { height: 34px; width: auto; }
        .turma-logo-container { display: flex; }
        .turma-logo { height: 34px; width: auto; border-radius: 8px; }
 
        .logo-text {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.4rem;
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 1.2rem;
            white-space: nowrap;
        }
        .med-text { color: var(--text-primary); }
        .tasks-text { color: var(--primary-green-light); }
        .turma-badge {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.68rem;
            letter-spacing: 0.02em;
            color: var(--primary-green-light);
            background: rgba(107, 122, 42, 0.15);
            border: 1px solid rgba(107, 122, 42, 0.35);
            padding: 0.2rem 0.55rem;
            border-radius: 20px;
        }
 
        .menu-icon { display: none; font-size: 1.35rem; color: var(--text-primary); cursor: pointer; }
 
        .nav-links { display: flex; align-items: center; gap: 1.4rem; }
        .nav-links a {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 500;
            transition: color 0.2s ease;
            white-space: nowrap;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--primary-green-light); }
        .nav-links a.btn-add {
            color: #fff;
            background: var(--primary-green);
            padding: 0.55rem 1rem;
            border-radius: 10px;
            font-weight: 600;
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .nav-links a.btn-add:hover { background: var(--primary-green-light); transform: translateY(-1px); color: #fff; }
 
        @media (max-width: 900px) {
            .menu-icon { display: block; }
            .nav-links {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                flex-direction: column;
                align-items: stretch;
                gap: 0;
                background: var(--bg-card);
                border-bottom: 1px solid var(--border-color);
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.3s ease;
            }
            .nav-links.active { max-height: 500px; }
            .nav-links a { padding: 0.9rem 1.5rem; border-top: 1px solid var(--border-color); }
            .nav-links a.btn-add { margin: 0.75rem 1.5rem; border-top: none; }
        }
 
        /* ===== Loader ===== */
        .loader {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary-green-light);
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
 
        /* ===== Layout ===== */
        .task-detail-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2.5rem 2rem 4rem;
        }
 
        .task-card {
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-soft);
        }
 
        .task-header {
            position: relative;
            padding: 2.25rem 2rem;
            background:
                radial-gradient(600px 200px at 90% -20%, rgba(255, 255, 255, 0.08), transparent 60%),
                linear-gradient(135deg, var(--primary-green) 0%, var(--primary-green-dark) 100%);
        }
 
        .task-header h1 {
            font-size: 1.7rem;
            color: #fdfdf7;
            display: flex;
            align-items: center;
            gap: 0.65rem;
            word-break: break-word;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }
        .task-header h1 i { font-size: 1.35rem; opacity: 0.9; }
 
        .task-type-badge {
            display: inline-block;
            margin-top: 0.85rem;
            padding: 0.35rem 0.95rem;
            border-radius: 20px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            background: rgba(255, 255, 255, 0.16);
            color: #fdfdf7;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }
        .task-type-badge.tipo-prova { background: rgba(239, 68, 68, 0.22); border-color: rgba(239, 68, 68, 0.45); color: #fecaca; }
        .task-type-badge.tipo-trabalho { background: rgba(59, 130, 246, 0.22); border-color: rgba(59, 130, 246, 0.45); color: #bfdbfe; }
        .task-type-badge.tipo-seminario { background: rgba(139, 92, 246, 0.22); border-color: rgba(139, 92, 246, 0.45); color: #ddd6fe; }
        .task-type-badge.tipo-atividade { background: rgba(255, 255, 255, 0.16); border-color: rgba(255, 255, 255, 0.3); color: #fdfdf7; }
        .task-type-badge.tipo-pratica { background: rgba(245, 158, 11, 0.22); border-color: rgba(245, 158, 11, 0.45); color: #fde68a; }
 
        .task-body { padding: 2rem; }
 
        /* Admin actions */
        .admin-actions {
            display: flex;
            gap: 0.85rem;
            flex-wrap: wrap;
            margin-bottom: 1.75rem;
            padding-bottom: 1.75rem;
            border-bottom: 1px dashed var(--border-color);
        }
        .btn-admin {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            padding: 0.65rem 1.15rem;
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-admin:hover { border-color: var(--primary-green-light); color: var(--primary-green-light); transform: translateY(-1px); }
        .btn-admin.btn-danger { border-color: rgba(239, 68, 68, 0.4); color: var(--danger); }
        .btn-admin.btn-danger:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
 
        .add-days-group { display: inline-flex; gap: 0.5rem; align-items: center; }
        .add-days-group input {
            width: 130px;
            padding: 0.65rem 0.85rem;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 0.88rem;
        }
        .add-days-group input:focus { outline: none; border-color: var(--primary-green-light); box-shadow: 0 0 0 3px rgba(107, 122, 42, 0.2); }
 
        /* Observação geral */
        .observacao-geral {
            display: flex;
            gap: 0.65rem;
            align-items: flex-start;
            background: rgba(59, 130, 246, 0.08);
            border-left: 3px solid var(--accent-blue);
            padding: 1rem 1.15rem;
            border-radius: 10px;
            margin-bottom: 1.75rem;
            font-size: 0.92rem;
            color: var(--text-primary);
        }
        .observacao-geral i { color: var(--accent-blue); margin-top: 0.15rem; }
        .observacao-geral strong { font-weight: 600; }
 
        /* Descrição */
        .descricao-box {
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 1.5rem;
            margin-bottom: 1.75rem;
        }
        .descricao-box h3 {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: none;
            color: var(--text-secondary);
            margin-bottom: 0.85rem;
        }
        .descricao-box h3 i { color: var(--primary-green-light); }
        .descricao-box p { margin: 0; line-height: 1.7; white-space: pre-wrap; word-break: break-word; color: var(--text-primary); }
        .descricao-box a { color: var(--primary-green-light); text-decoration: none; border-bottom: 1px solid rgba(151, 172, 62, 0.4); }
        .descricao-box a:hover { border-color: var(--primary-green-light); }
 
        /* Info grid */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 1rem;
            margin-bottom: 1.75rem;
        }
        .info-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem 1.1rem;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }
        .info-card:hover { border-color: rgba(107, 122, 42, 0.5); transform: translateY(-2px); }
        .info-card h3 {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.45rem;
            margin-bottom: 0.5rem;
            letter-spacing: 0.01em;
        }
        .info-card h3 i { color: var(--primary-green-light); }
        .info-card p { margin: 0; font-size: 0.98rem; font-weight: 500; word-break: break-word; color: var(--text-primary); }
 
        /* Turmas */
        .turmas-section {
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 1.25rem;
            margin-bottom: 1.75rem;
        }
        .turmas-section h3 {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        .turma-detail-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.15rem;
            background: var(--bg-card);
            border-radius: 12px;
            margin-bottom: 0.75rem;
            border-left: 4px solid var(--primary-green);
            transition: transform 0.2s ease;
        }
        .turma-detail-card:hover { transform: translateX(2px); }
        .turma-detail-card:last-child { margin-bottom: 0; }
        .turma-detail-info { flex: 1; min-width: 0; }
        .turma-name {
            font-family: 'IBM Plex Sans', sans-serif;
            font-weight: 700;
            font-size: 0.98rem;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.45rem;
        }
        .turma-obs { font-size: 0.82rem; color: var(--text-secondary); line-height: 1.5; }
        .turma-date { text-align: right; flex-shrink: 0; }
        .turma-date .date { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 1.02rem; color: var(--primary-green-light); }
        .turma-date .status { font-size: 0.72rem; color: var(--text-secondary); margin-top: 0.15rem; }
 
        /* Comentários */
        .comentarios-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-soft);
        }
        .comentarios-header {
            padding: 1.1rem 1.5rem;
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border-color);
        }
        .comentarios-header h3 { display: flex; align-items: center; gap: 0.55rem; font-size: 1rem; }
        .comentarios-header h3 i { color: var(--primary-green-light); }
 
        .comentarios-list { padding: 1.25rem 1.5rem; max-height: 420px; overflow-y: auto; }
        .comentario-item {
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem 1.1rem;
            margin-bottom: 0.9rem;
        }
        .comentario-item:last-child { margin-bottom: 0; }
        .comentario-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .comentario-author { font-weight: 700; color: var(--primary-green-light); font-size: 0.92rem; }
        .comentario-date { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--text-secondary); }
        .comentario-text { color: var(--text-primary); line-height: 1.6; font-size: 0.94rem; }
 
        .novo-comentario { padding: 1.25rem 1.5rem 1.5rem; border-top: 1px solid var(--border-color); }
        .form-select, .textarea-comentario {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 0.92rem;
            margin-bottom: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .form-select:focus, .textarea-comentario:focus {
            outline: none;
            border-color: var(--primary-green-light);
            box-shadow: 0 0 0 3px rgba(107, 122, 42, 0.2);
        }
        .textarea-comentario { resize: vertical; min-height: 90px; font-family: inherit; }
 
        .btn-enviar {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            background: var(--primary-green);
            border: none;
            padding: 0.75rem 1.4rem;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            font-size: 0.92rem;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .btn-enviar:hover { background: var(--primary-green-light); transform: translateY(-2px); }
 
        .btn-submit {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
            background: var(--primary-green);
            color: #fff;
            padding: 0.75rem 1.4rem;
            border-radius: 10px;
            font-weight: 600;
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .btn-submit:hover { background: var(--primary-green-light); transform: translateY(-2px); }
 
        /* Botão voltar ao topo */
        .btn-voltar {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: var(--primary-green);
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, background 0.2s ease;
            z-index: 100;
        }
        .btn-voltar:hover { transform: scale(1.08); background: var(--primary-green-light); }
 
        .loading { text-align: center; padding: 3.5rem 1rem; color: var(--text-secondary); }
 
        /* Footer */
        .footer {
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: 2rem 0;
            margin-top: 2rem;
        }
        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.82rem;
        }
 
        @media (max-width: 768px) {
            .task-detail-container { padding: 1.5rem 1rem 3rem; }
            .task-header { padding: 1.65rem 1.5rem; }
            .task-header h1 { font-size: 1.3rem; }
            .task-body { padding: 1.5rem; }
            .info-grid { grid-template-columns: 1fr 1fr; }
            .turma-detail-card { flex-direction: column; align-items: flex-start; gap: 0.6rem; }
            .turma-date { text-align: left; }
            .comentarios-list { padding: 1rem; max-height: 320px; }
            .novo-comentario { padding: 1rem; }
            .form-select, .textarea-comentario { font-size: 16px; }
            .btn-voltar { bottom: 1.25rem; right: 1.25rem; }
        }
 
        @media (max-width: 480px) {
            .info-grid { grid-template-columns: 1fr; }
            .admin-actions { flex-direction: column; align-items: stretch; }
            .add-days-group { width: 100%; }
            .add-days-group input { flex: 1; width: auto; }
        }
    </style>
</head>

        function getAlunoName(id) {
            const aluno = alunos.find(a => a.id === id);
            return aluno ? aluno.complete : id;
        }

        function getDisciplinaLabel(value) {
            const disc = disciplinas.find(d => d.value === value);
            return disc ? disc.label : value;
        }

        function formatarData(timestamp) {
            const data = new Date(timestamp);
            const dia = data.getUTCDate().toString().padStart(2, '0');
            const mes = (data.getUTCMonth() + 1).toString().padStart(2, '0');
            const ano = data.getUTCFullYear();
            return `${dia}/${mes}/${ano}`;
        }

        function formatarDataCompleta(timestamp) {
            const data = new Date(timestamp);
            const dia = data.getUTCDate().toString().padStart(2, '0');
            const mes = (data.getUTCMonth() + 1).toString().padStart(2, '0');
            const ano = data.getUTCFullYear();
            const horas = data.getUTCHours().toString().padStart(2, '0');
            const minutos = data.getUTCMinutes().toString().padStart(2, '0');
            return `${dia}/${mes}/${ano} às ${horas}:${minutos}`;
        }

        function getTipoClass(tipo) {
            const classes = {
                'prova': 'tipo-prova',
                'trabalho': 'tipo-trabalho',
                'seminário': 'tipo-seminario',
                'atividade': 'tipo-atividade',
                'prática': 'tipo-pratica'
            };
            return classes[tipo?.toLowerCase()] || 'tipo-atividade';
        }

        async function addDays(id, days) {
            try {
                const response = await fetch(`/moredays?id=${id}&days=${days}`);
                const result = await response.json();
                
                if (result.success) {
                    alert(`✅ ${days} dia(s) adicionado(s) a todas as turmas com sucesso!`);
                    carregarTarefa(id); // Recarregar a página para mostrar as novas datas
                } else {
                    alert('Erro ao adicionar os dias: ' + (result.reason || 'Tente novamente.'));
                }
            } catch (err) {
                console.error('Erro:', err);
                alert('Erro ao conectar com o servidor.');
            }
        }

        async function deleteTask(id) {
            if (confirm('Tem certeza que deseja deletar esta tarefa? Esta ação não pode ser desfeita.')) {
                try {
                    const response = await fetch(`/apagar?id=${id}&token=22222`);
                    const result = await response.json();
                    if (result.success === false) {
                        alert('Erro ao deletar tarefa!');
                    } else {
                        alert('Tarefa deletada com sucesso!');
                        window.location.href = isAdmin ? '/?admin=true' : '/';
                    }
                } catch (err) {
                    console.error('Erro:', err);
                    alert('Erro ao conectar com o servidor.');
                }
            }
        }

        async function addComment(id, author, comment) {
            try {
                const date = new Date().toISOString();
                const response = await fetch(`/comment?author=${author}&comment=${encodeURIComponent(comment)}&date=${date}&idtar=${id}`);
                const result = await response.json();
                if (result.success) {
                    carregarTarefa(id);
                    document.getElementById('novo-comentario').value = '';
                } else {
                    alert('Erro ao adicionar comentário.');
                }
            } catch (err) {
                console.error('Erro:', err);
                alert('Erro ao conectar com o servidor.');
            }
        }

        async function carregarTarefa(id) {
            try {
                const response = await fetch(`/search?id=${id}`);
                const tarefa = await response.json();
                
                if (!tarefa || tarefa === null) {
                    document.getElementById('taskContainer').innerHTML = `
                        <div class="task-card">
                            <div class="task-header">
                                <h1>Tarefa não encontrada</h1>
                            </div>
                            <div class="task-body">
                                <p>A tarefa solicitada não existe ou foi removida.</p>
                                <a href="/" class="btn-submit" style="display: inline-block; text-decoration: none; margin-top: 1rem;">Voltar ao início</a>
                            </div>
                        </div>
                    `;
                    return;
                }
                
                const tipoLabel = tarefa.tipo ? tarefa.tipo.charAt(0).toUpperCase() + tarefa.tipo.slice(1) : 'Não definido';
                
                let turmasHtml = '';
                if (tarefa.turmasInfo && tarefa.turmasInfo.length > 0) {
                    tarefa.turmasInfo.forEach(info => {
                        const turmaLabel = info.turma === 't1-t3' ? 'Turmas T1 - T3' : 'Turmas T4 - T6';
                        const turmaClass = info.turma === 't1-t3' ? 'turma-t1' : 'turma-t4';
                        turmasHtml += `
                            <div class="turma-detail-card">
                                <div class="turma-detail-info">
                                    <div class="turma-name" style="color: ${info.turma === 't1-t3' ? 'var(--primary-green)' : '#3b82f6'}">
                                        <i class="fas ${info.turma === 't1-t3' ? 'fa-users' : 'fa-user-md'}"></i> ${turmaLabel}
                                    </div>
                                    ${info.observacao ? `<div class="turma-obs"><i class="fas fa-info-circle"></i> <span style="white-space: pre-wrap;">${info.observacao.replace(/\n/g, '<br>')}</span></div>` : ''}
                                </div>
                                <div class="turma-date">
                                    <div class="date">${formatarData(info.entrega)}</div>
                                    <div class="status">Data de entrega</div>
                                </div>
                            </div>
                        `;
                    });
                } else if (tarefa.turma && tarefa.entrega) {
                    // Compatibilidade com formato antigo
                    const turmaLabel = tarefa.turma === 't1-t3' ? 'Turmas T1 - T3' : 'Turmas T4 - T6';
                    turmasHtml = `
                        <div class="turma-detail-card">
                            <div class="turma-detail-info">
                                <div class="turma-name">${turmaLabel}</div>
                            </div>
                            <div class="turma-date">
                                <div class="date">${formatarData(tarefa.entrega)}</div>
                                <div class="status">Data de entrega</div>
                            </div>
                        </div>
                    `;
                }
                
                const adminHtml = isAdmin ? `
                    <div class="admin-actions">
                        <div class="add-days-group">
                            <input type="number" id="diasAdicionar" placeholder="Dias a adicionar" style="width: 120px;">
                            <button class="btn-admin" id="btnAddDays">
                                <i class="fas fa-plus-circle"></i> Adicionar Dias
                            </button>
                        </div>
                        <button class="btn-admin btn-danger" id="btnDelete">
                            <i class="fas fa-trash-alt"></i> Deletar Tarefa
                        </button>
                    </div>
                ` : '';
                
                const observacaoGeralHtml = tarefa.observacaoGeral ? `
                    <div class="observacao-geral">
                        <i class="fas fa-info-circle"></i> <strong>Observação Geral:</strong> 
                        <span style="white-space: pre-wrap;">${tarefa.observacaoGeral.replace(/\n/g, '<br>')}</span>
                    </div>
                ` : '';
                
                const comentariosHtml = tarefa.comments && tarefa.comments.length > 0 ? 
                    tarefa.comments.map(comment => `
                        <div class="comentario-item">
                            <div class="comentario-header">
                                <span class="comentario-author">${getAlunoName(comment.author)}</span>
                                <span class="comentario-date">${formatarDataCompleta(comment.date)}</span>
                            </div>
                            <div class="comentario-text">${comment.comment}</div>
                        </div>
                    `).join('') : 
                    '<p style="text-align: center; color: var(--text-secondary);">Nenhum comentário ainda. Seja o primeiro a comentar!</p>';
                
              const html = `
                <div class="task-card">
                    <div class="task-header">
                        <h1><i class="fas fa-tasks"></i> ${tarefa.title}</h1>
                        <span class="task-type-badge ${getTipoClass(tarefa.tipo)}">${tipoLabel}</span>
                    </div>
                    <div class="task-body">
                        ${adminHtml}
                        
                        ${observacaoGeralHtml}
                        
                        <div class="descricao-box">
                            <h3><i class="fas fa-align-left"></i> Descrição</h3>
                            <p>${tarefa.desc.replace(/\n/g, '<br>').replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>')}</p>
                        </div>
                        
                        <div class="info-grid">
                            <div class="info-card">
                                <h3><i class="fas fa-user-md"></i> Autor</h3>
                                <p>${getAlunoName(tarefa.author)}</p>
                            </div>
                            <div class="info-card">
                                <h3><i class="fas fa-book"></i> Disciplina</h3>
                                <p>${getDisciplinaLabel(tarefa.disc)}</p>
                            </div>
                            <div class="info-card">
                                <h3><i class="fas fa-chart-line"></i> Nível</h3>
                                <p>${tarefa.nivel}</p>
                            </div>
                            <div class="info-card">
                                <h3><i class="fas fa-calendar-day"></i> Data Solicitada</h3>
                                <p>${formatarData(tarefa.pedida)}</p>
                            </div>
                            <div class="info-card">
                                <h3><i class="fas fa-clock"></i> Registrado em</h3>
                                <p>${formatarDataCompleta(tarefa.registered)}</p>
                            </div>
                        </div>
                        
                        ${turmasHtml ? `
                            <div class="turmas-section">
                                <h3><i class="fas fa-users"></i> Turmas e Datas de Entrega</h3>
                                ${turmasHtml}
                            </div>
                        ` : ''}
                        
                        <!-- COMENTÁRIOS DENTRO DO TASK-BODY -->
                        <div class="comentarios-section">
                            <div class="comentarios-header">
                                <h3><i class="fas fa-comments"></i> Comentários (${tarefa.comments?.length || 0})</h3>
                            </div>
                            <div class="comentarios-list" id="comentariosList">
                                ${comentariosHtml}
                            </div>
                            <div class="novo-comentario">
                                <select id="selecionar-nome" class="form-select">
                                    <option value="">Selecione seu nome</option>
                                    ${alunos.map(aluno => `<option value="${aluno.id}">${aluno.complete}</option>`).join('')}
                                </select>
                                <textarea id="novo-comentario" class="textarea-comentario" rows="3" placeholder="Digite seu comentário aqui..."></textarea>
                                <button id="enviar-comentario" class="btn-enviar">
                                    <i class="fas fa-paper-plane"></i> Enviar Comentário
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
                
                document.getElementById('taskContainer').innerHTML = html;
                
                if (isAdmin) {
                    document.getElementById('btnAddDays')?.addEventListener('click', () => {
                        const dias = document.getElementById('diasAdicionar').value;
                        if (dias && !isNaN(dias)) {
                            addDays(id, dias);
                        } else {
                            alert('Digite um número válido de dias.');
                        }
                    });
                    document.getElementById('btnDelete')?.addEventListener('click', () => deleteTask(id));
                }
                
                document.getElementById('enviar-comentario')?.addEventListener('click', () => {
                    const author = document.getElementById('selecionar-nome').value;
                    const comment = document.getElementById('novo-comentario').value.trim();
                    if (!author) {
                        alert('Por favor, selecione seu nome.');
                        return;
                    }
                    if (!comment) {
                        alert('Por favor, digite um comentário.');
                        return;
                    }
                    addComment(id, author, comment);
                });
                
            } catch (err) {
                console.error('Erro ao carregar tarefa:', err);
                document.getElementById('taskContainer').innerHTML = `
                    <div class="task-card">
                        <div class="task-header">
                            <h1>Erro ao carregar tarefa</h1>
                        </div>
                        <div class="task-body">
                            <p>Ocorreu um erro ao carregar os detalhes da tarefa. Tente novamente mais tarde.</p>
                            <a href="/" class="btn-submit" style="display: inline-block; text-decoration: none; margin-top: 1rem;">Voltar ao início</a>
                        </div>
                    </div>
                `;
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            if (tarefaId) {
                carregarTarefa(tarefaId);
            } else {
                document.getElementById('taskContainer').innerHTML = `
                    <div class="task-card">
                        <div class="task-header">
                            <h1>Tarefa não especificada</h1>
                        </div>
                        <div class="task-body">
                            <p>Nenhum ID de tarefa foi fornecido.</p>
                            <a href="/" class="btn-submit" style="display: inline-block; text-decoration: none; margin-top: 1rem;">Voltar ao início</a>
                        </div>
                    </div>
                `;
            }
            
            document.getElementById('btnVoltar').addEventListener('click', () => {
                window.location.href = isAdmin ? '/?admin=true' : '/';
            });
            
            document.getElementById('menuIcon').addEventListener('click', () => {
                document.getElementById('navLinks').classList.toggle('active');
            });
        });
    </script>
